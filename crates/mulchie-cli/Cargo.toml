[package]
name = "mulchie"
description = "Command-line monitor and optimizer for machines running many AI agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
mulchie-core.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
libc.workspace = true
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
clap_complete = "4.6.11"
toml_edit = "0.25.19"

[dev-dependencies]
tempfile.workspace = true

[features]
default = ["network"]
# Update checks over HTTPS in the engine (`mulchie serve`). Without it the
# engine reports that this build has no network support.
network = ["mulchie-core/network"]
