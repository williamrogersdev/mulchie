[package]
name = "mulchie-app"
description = "Mulchie desktop app (Tauri)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[dependencies]
# `network`: update checks over HTTPS (the workspace dependency turns it off).
mulchie-core = { workspace = true, features = ["network"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-updater = "2.14.0"

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
