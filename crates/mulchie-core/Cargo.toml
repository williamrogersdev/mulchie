[package]
name = "mulchie-core"
description = "Core library for Mulchie: monitor and optimizer for machines running many AI agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
semver.workspace = true
toml.workspace = true
# HTTPS for update and advisory checks (rustls with ring, webpki roots). Its C
# build needs a compiler for the target, so it sits behind `network`.
ureq = { workspace = true, optional = true }

[features]
default = ["network"]
# Update checks over HTTPS. Without it every check reports that this build
# has no network support, and nothing leaves the machine.
network = ["dep:ureq"]

[dev-dependencies]
tempfile.workspace = true
