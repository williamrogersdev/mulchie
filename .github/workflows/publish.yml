name: Publish

# Called by release.yml as soon as it has published a GitHub Release:
#   - updates the Homebrew tap (cask and formula; only the formula when the release has no
#     DMG, which is a CLI-only release)
#   - publishes mulchie-core and mulchie to crates.io
# Both are skipped for a pre-release (a tag with a suffix, such as v0.3.0-rc.1): a crates.io
# publish cannot be undone and the tap has no pre-release channel.
# Each job skips with a warning when its secret is missing. Running it again is safe:
#   gh workflow run publish.yml -f tag=vX.Y.Z
# Secrets: docs/RELEASING.md.

on:
  workflow_call:
    inputs:
      tag:
        description: "The release tag, such as v0.3.0."
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag of a published release, such as v0.3.0."
        type: string
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag }}

jobs:
  homebrew:
    name: Update Homebrew tap
    if: ${{ !contains(inputs.tag, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: publish-homebrew
      cancel-in-progress: false
    env:
      TAP_REPO: williamrogersdev/homebrew-tap
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check for the tap token
        id: gate
        run: |
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set, so the tap was not updated. See docs/RELEASING.md."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out source
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag matches the workspace version
        if: steps.gate.outputs.enabled == 'true'
        id: version
        run: echo "version=$(scripts/workspace-version.sh "$TAG")" >> "$GITHUB_OUTPUT"

      # The release's own asset list decides: a DMG means a full release (cask and
      # formula), no DMG means a CLI-only one (formula only).
      - name: Look for a DMG among the release assets
        if: steps.gate.outputs.enabled == 'true'
        id: kind
        run: |
          DMGS="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name | select(endswith(".dmg"))] | length')"
          if [[ "$DMGS" -gt 0 ]]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$TAG has no DMG, so only the Homebrew formula is updated, not the cask."
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release assets
        if: steps.gate.outputs.enabled == 'true'
        run: |
          mkdir assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets \
            --pattern '*.tar.gz.sha256' --pattern 'SHA256SUMS' --pattern '*.dmg'
          ls -l assets
          # A full release lists its DMG in SHA256SUMS. If it does and the DMG is gone, stop.
          if [[ "${{ steps.kind.outputs.app }}" != "true" ]] && grep -q '\.dmg' assets/SHA256SUMS; then
            echo "::error::SHA256SUMS lists a DMG but the release has none. Refusing to publish a formula-only update."
            exit 1
          fi

      - name: Check the DMG against SHA256SUMS
        if: steps.gate.outputs.enabled == 'true' && steps.kind.outputs.app == 'true'
        run: |
          cd assets
          grep -F "Mulchie_${VERSION}_universal.dmg" SHA256SUMS | sha256sum -c -
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Check out the tap
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TAP_REPO }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Render cask and formula
        if: steps.gate.outputs.enabled == 'true'
        run: |
          if [[ "$APP" == "true" ]]; then
            scripts/render-homebrew.sh "$VERSION" assets tap
          else
            scripts/render-homebrew.sh --formula-only "$VERSION" assets tap
          fi
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APP: ${{ steps.kind.outputs.app }}

      - name: Commit and push to the tap
        if: steps.gate.outputs.enabled == 'true'
        working-directory: tap
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APP: ${{ steps.kind.outputs.app }}
        run: |
          git add Formula/mulchie-cli.rb
          if [[ "$APP" == "true" ]]; then
            git add Casks/mulchie.rb
          fi
          if git diff --cached --quiet; then
            echo "The tap is already at $VERSION."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "mulchie $VERSION"
          git push origin HEAD

  crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish-crates
      cancel-in-progress: false
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Check for the registry token
        id: gate
        run: |
          if [[ "$TAG" == *-* ]]; then
            echo "::notice::$TAG is a pre-release, so nothing was published to crates.io (a publish cannot be undone). See docs/RELEASING.md."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set, so nothing was published to crates.io. See docs/RELEASING.md."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out source
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Install Rust
        if: steps.gate.outputs.enabled == 'true'
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Check the tag matches the workspace version
        if: steps.gate.outputs.enabled == 'true'
        id: version
        run: echo "version=$(scripts/workspace-version.sh "$TAG")" >> "$GITHUB_OUTPUT"

      # mulchie depends on mulchie-core, so the library goes first. cargo waits for the
      # new version to show up in the index before it returns.
      - name: Publish mulchie-core and mulchie
        if: steps.gate.outputs.enabled == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for crate in mulchie-core mulchie; do
            code="$(curl -s -o /dev/null -w '%{http_code}' -A 'mulchie-release-workflow' "https://crates.io/api/v1/crates/$crate/$VERSION")"
            if [[ "$code" == "200" ]]; then
              echo "::notice::$crate $VERSION is already on crates.io, skipping."
              continue
            fi
            cargo publish --locked -p "$crate"
          done
