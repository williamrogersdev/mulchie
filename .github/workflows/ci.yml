name: CI

# Runs on every pull request, and on every push to main through main.yml, which calls
# this workflow and then decides whether the commit is a release.
# The ruleset on main requires one check from here: "CI passed".

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A pull request keeps only its newest run. Every commit on main gets its own run, so a
# later merge never cancels the checks, or the release, of an earlier one.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS builds the whole workspace, including the Tauri app.
          - os: macos-latest
            packages: --workspace
          # Ubuntu skips mulchie-app: it needs the WebKitGTK system libraries.
          - os: ubuntu-latest
            packages: -p mulchie-core -p mulchie
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked ${{ matrix.packages }} --all-targets -- -D warnings

      # The build without the HTTPS client (`--no-default-features`), for Linux
      # packagers who want no network code; update checks then report that.
      - name: Clippy without the network feature
        if: runner.os == 'Linux'
        run: cargo clippy --locked -p mulchie-core -p mulchie --all-targets --no-default-features -- -D warnings

      - name: Test
        run: cargo test --locked ${{ matrix.packages }}

      # Already part of the run above; repeated by name so a failure is easy to spot.
      # Builds the binary and drives `mulchie mcp` over real stdio with a temp HOME:
      # initialize, tools/list, diagnose, a plan call, read-only refusals.
      - name: MCP smoke test
        run: cargo test --locked -p mulchie --test mcp_smoke

      - name: Discovery files (openapi.yaml routes, server.json version)
        run: cargo test --locked -p mulchie --test discovery

  scripts:
    name: Scripts and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash -o "$RUNNER_TEMP/download-actionlint.bash"
          bash "$RUNNER_TEMP/download-actionlint.bash" 1.7.12 "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      - name: actionlint
        run: actionlint

      - name: Installer test
        run: scripts/test-install.sh

      - name: Version bump script test
        run: scripts/test-bump-version.sh

      # Merging a version change releases it (main.yml), so the version in
      # Cargo.toml must be releasable in every pull request: the same version in every
      # file that carries it, and dated notes in CHANGELOG.md.
      - name: The workspace version is releasable
        run: |
          VERSION="$(scripts/workspace-version.sh)"
          scripts/bump-version.sh --check
          scripts/release-notes.sh "$VERSION" --release > /dev/null
          echo "Version $VERSION is consistent and has release notes."

  # Builds the site and runs its SEO check. site.yml deploys it from main.
  site:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and check
        run: bun run build

  # The one check the main branch ruleset requires. It passes only when every job above
  # passed, so a new job is covered by adding it to `needs` here, not by editing the ruleset.
  ok:
    name: CI passed
    if: always()
    needs: [rust, scripts, site]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "::error::A CI job did not pass ($RESULTS)"
              exit 1
            fi
          done
