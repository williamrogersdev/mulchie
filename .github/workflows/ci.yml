name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS builds the whole workspace, including the Tauri app.
          - os: macos-latest
            packages: --workspace
          # Ubuntu skips mulchie-app: it needs the WebKitGTK system libraries.
          - os: ubuntu-latest
            packages: -p mulchie-core -p mulchie
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked ${{ matrix.packages }} --all-targets -- -D warnings

      # The build without the HTTPS client (`--no-default-features`), for Linux
      # packagers who want no network code; update checks then report that.
      - name: Clippy without the network feature
        if: runner.os == 'Linux'
        run: cargo clippy --locked -p mulchie-core -p mulchie --all-targets --no-default-features -- -D warnings

      - name: Test
        run: cargo test --locked ${{ matrix.packages }}

      # Already part of the run above; repeated by name so a failure is easy to spot.
      # Builds the binary and drives `mulchie mcp` over real stdio with a temp HOME:
      # initialize, tools/list, diagnose, a plan call, read-only refusals.
      - name: MCP smoke test
        run: cargo test --locked -p mulchie --test mcp_smoke

      - name: Discovery files (openapi.yaml routes, server.json version)
        run: cargo test --locked -p mulchie --test discovery

  scripts:
    name: Scripts and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.sh -o "$RUNNER_TEMP/download-actionlint.sh"
          bash "$RUNNER_TEMP/download-actionlint.sh" 1.7.12 "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      - name: actionlint
        run: actionlint

      - name: Installer test
        run: scripts/test-install.sh
