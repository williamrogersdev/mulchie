name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problem? Do not file it here. See SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran or clicked, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mulchie version
      description: Output of `mulchie --version`.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - Homebrew cask
        - Homebrew formula (mulchie-cli)
        - install.sh
        - cargo install
        - Built from source
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: macOS 15.1, arm64
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `mulchie doctor`
      render: text
