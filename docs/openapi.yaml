openapi: 3.1.0
info:
  title: Mulchie local API
  version: 0.3.0-rc.7
  summary: The engine's HTTP API on 127.0.0.1, for the CLI, the app, the MCP server and scripts.
  description: |
    The engine (the menu bar app or `mulchie serve`) listens on 127.0.0.1 only, on the
    port in `api_port` (default 47474; `MULCHIE_PORT` overrides it for one process). The
    port in use is recorded in the engine lock file.

    Authentication: every route except `GET /v1/health` needs `Authorization: Bearer <token>`.
    - The full token is in `<config dir>/token` (`mulchie token` prints the path).
    - A read-only token is in `<config dir>/token.read` (`mulchie token --read-only`). It is
      accepted on every `GET` route, on `POST /v1/clean/plan`, `POST /v1/worktree/plan` and
      `POST /v1/process/plan`, on `POST /v1/lease` (with `ttl_secs` and no `pid`) and
      `POST /v1/release`, and on `POST /v1/hook` and `POST /v1/guard/check`; any other route
      answers 403 `read_only_token`.
    Both files are mode 0600 in a 0700 directory; a token file with looser permissions is refused.

    Requests must send `Host: 127.0.0.1:<port>` or `localhost:<port>` and no `Origin` header,
    so web pages cannot drive the API. Limits: request line 8 KB, headers 64 KB, body 1 MB,
    10 s per request, 64 connections.

    Deleting is plan-then-execute: get a plan (`GET /v1/sweep`, `GET|POST /v1/clean/plan`,
    `POST /v1/worktree/plan`), show it, then post back the approved items' `request` objects
    as `{"items": [...]}`. The engine's safety gate re-checks every item when it runs and
    skips anything that changed.

    This file is checked against the server's route table by
    `cargo test -p mulchie --test discovery`.
  license:
    name: MIT
servers:
  - url: http://127.0.0.1:47474
    description: The default port
security:
  - bearer: []
paths:
  /v1/health:
    get:
      summary: Liveness and a one-line summary
      description: Needs no token.
      security: []
      responses:
        "200":
          description: The summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string, const: mulchie }
                  version: { type: string }
                  health: { $ref: "#/components/schemas/Health" }
                  stale: { type: boolean }
                  sample_age_secs: { type: [integer, "null"] }
                  disk_free: { type: integer }
                  disk_total: { type: integer }
                  cpu_pct: { type: number }
                  load: { type: array, items: { type: number } }
                  mem_free_pct: { type: number }
                  agents: { type: integer }
                  builds: { type: integer }
                  free_slots: { type: integer }
                  ok_to_start_heavy_work: { type: boolean }
                  reclaimable_stale: { type: integer }
                  restarts: { type: integer }
                  journal_error: { type: string, description: Why the action journal could not be written; absent when it can }
                  journal_lost: { type: integer, description: "Journal entries that could not be written since the engine started. The first entry written after a failure is preceded by a `journal_gap` entry: \"journal gap: N entries lost between T1 and T2 (unix seconds)\"" }
                  scan_age_secs: { type: [integer, "null"] }
                  scan_stale: { type: boolean, description: The last scan is older than twice the scan interval plus 10 minutes }
                  findings: { $ref: "#/components/schemas/FindingCounts" }
                  sessions_running: { type: integer, description: Agent sessions running now }
                  breaches_active: { type: integer, description: Limit breaches not yet cleared }
                  updates_available: { type: integer, description: Open findings of category `update` }
  /v1/state:
    get:
      summary: Everything the engine knows
      description: |
        The latest snapshot (machine figures, top processes, workspaces, `consumers` groups,
        `cpu_summary` and `mem_summary` in words), health, config error, build slots, forecast,
        last scan, disk map and recent actions. Also `journal_error`, `journal_lost`, `restore_failed`,
        `scan_age_secs`, `scan_stale`, `findings` (as in `GET /v1/findings?dismissed=1`),
        `finding_counts` and `findings_unix`, `sessions` (as `SessionsState`; its `list` holds every
        running session, up to 500, and the 50 most recently ended) and `updates`
        (as `GET /v1/updates` without `report`). Command lines and lease labels are redacted.
        `failures` lists each cache, cache key or worktree that was skipped at least twice in
        a row and is still there: `kind` (`reclaim` or `worktree`), `target`, `count`, the
        last `reason` and `detail`, `first_unix`, `last_unix`, `advice` and, from the third skip,
        `retry_after_unix` (the engine's automatic sweep and reclaim leave the target alone
        until then). A success clears the record. `issue_counts` counts the unresolved issues
        and `top_issues` holds up to five of them that came back most often (as `GET /v1/issues`).
        `otel` is the trace receiver in brief: `enabled`, `listening`, `port`, `error`, `services`,
        `endpoints_slower` and `endpoints_failing` (see `GET /v1/otel`).

        Swap: each process in `snapshot.top` and each consumer group carries `swap_bytes`, its memory
        compressed or swapped out (on macOS its physical footprint minus what is resident; 0 for
        other users' processes and on other systems). `snapshot.consumers.by_swap` ranks the groups
        holding the most, and `snapshot.consumers.apps` lists every app group (up to 100), biggest
        memory first.
      responses:
        "200": { $ref: "#/components/responses/Json" }
        default: { $ref: "#/components/responses/Error" }
  /v1/history:
    get:
      summary: Samples from the last 30 minutes, every 3 seconds
      parameters:
        - name: since
          in: query
          required: false
          description: Only samples taken after this time (unix seconds, compared with each sample's `t`)
          schema: { type: integer, minimum: 0 }
      responses:
        "200": { $ref: "#/components/responses/Json" }
        default: { $ref: "#/components/responses/Error" }
  /v1/advice:
    get:
      summary: Whether to start heavy work now, free slots and the suggested job count
      responses:
        "200": { $ref: "#/components/responses/Json" }
        default: { $ref: "#/components/responses/Error" }
  /v1/scan:
    post:
      summary: Queue a scan for build caches and worktrees
      responses:
        "200":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  queued: { type: boolean }
        default: { $ref: "#/components/responses/Error" }
  /v1/clean/plan:
    get:
      summary: Plan deleting stale build caches
      parameters:
        - name: want_bytes
          in: query
          required: false
          description: Stop once the plan would free this much
          schema: { type: integer, minimum: 0 }
      responses:
        "200": { $ref: "#/components/responses/Plan" }
        default: { $ref: "#/components/responses/Error" }
    post:
      summary: Plan deleting specific caches, or stale ones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paths: { type: array, items: { type: string } }
                stale: { type: boolean }
                want_bytes: { type: integer }
      responses:
        "200": { $ref: "#/components/responses/Plan" }
        default: { $ref: "#/components/responses/Error" }
  /v1/clean:
    post:
      summary: Delete build caches
      description: |
        Send `{"items": [...]}`, the `request` objects of approved plan items (each must be
        `delete_cache`). `{"paths": [...]}` deletes those cache directories directly (an
        explicit list is its own approval), and `{"auto": true}` runs the automatic reclaim.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items: { type: array, items: { $ref: "#/components/schemas/Request" } }
                paths: { type: array, items: { type: string } }
                auto: { type: boolean }
                want_bytes: { type: integer }
      responses:
        "200": { $ref: "#/components/responses/Results" }
        default: { $ref: "#/components/responses/Error" }
  /v1/sweep:
    get:
      summary: Plan removing idle agent worktrees
      responses:
        "200": { $ref: "#/components/responses/Plan" }
        default: { $ref: "#/components/responses/Error" }
    post:
      summary: Remove approved idle agent worktrees
      description: "Send `{\"items\": [...]}` from `GET /v1/sweep` (each `remove_worktree` or `prune_worktree`), or `{\"auto\": true}`."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Items" }
      responses:
        "200": { $ref: "#/components/responses/Results" }
        default: { $ref: "#/components/responses/Error" }
  /v1/worktree/plan:
    post:
      summary: Plan removing specific worktrees
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paths]
              properties:
                paths: { type: array, items: { type: string } }
                allow_dirty: { type: boolean, description: Save uncommitted changes as a patch and remove anyway }
      responses:
        "200": { $ref: "#/components/responses/Plan" }
        default: { $ref: "#/components/responses/Error" }
  /v1/worktree/remove:
    post:
      summary: Remove approved worktrees
      description: "Send `{\"items\": [...]}` from `POST /v1/worktree/plan`. Each item names the HEAD seen when planning; a worktree whose HEAD moved is skipped."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Items" }
      responses:
        "200": { $ref: "#/components/responses/Results" }
        default: { $ref: "#/components/responses/Error" }
  /v1/prune:
    post:
      summary: Run a package manager's own prune command
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string, description: "npm, bun, pnpm, yarn, uv, pip, homebrew, go or simulators" }
      responses:
        "200": { $ref: "#/components/responses/Json" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspace:
    post:
      summary: Act on a workspace's processes owned by the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, action]
              properties:
                path: { type: string }
                action: { type: string, enum: [pause, resume, deprioritize, stop_builds, kill_all] }
                pids:
                  description: The previewed processes. When given, only these are acted on, each only if it still has this start time; the reply then has `results`.
                  type: array
                  items:
                    type: object
                    required: [pid, expected_start_time]
                    properties:
                      pid: { type: integer }
                      expected_start_time: { type: integer }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  processes: { type: integer }
                  results: { type: array, items: { $ref: "#/components/schemas/ActionResult" } }
        default: { $ref: "#/components/responses/Error" }
  /v1/process:
    post:
      summary: Signal or renice one process owned by the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pid, action]
              properties:
                pid: { type: integer }
                action: { type: string, enum: [term, kill, stop, cont, renice] }
                nice: { type: integer, description: For renice }
                expected_start_time:
                  type: integer
                  description: "The start time the caller saw. With it, a different process at this pid is skipped and the reply is `{\"ok\": false, \"result\": ActionResult}` with status 200."
      responses:
        "200": { $ref: "#/components/responses/Json" }
        default: { $ref: "#/components/responses/Error" }
  /v1/process/plan:
    post:
      summary: Plan acting on a process, a process tree or a consumer group
      description: |
        Either `pid` (with `signal`, default `term`, and `tree` for its descendants, deepest first)
        or `group` (a key from `snapshot.consumers.groups`) with `action`. Each item's `request`
        carries the start time seen now; send the ready ones to `POST /v1/process/execute`.
        Or `session` (an id from `GET /v1/sessions`) with `action`: the session's processes,
        without the agent itself unless `include_agent`.
        A plan that would signal the engine, `caller_pid` or any of their ancestors is refused
        (`protected`), for `pid`, `tree`, `group` and `session` alike. The engine cannot see who
        calls it over HTTP: only a client that sends `caller_pid` (its own pid) gets itself, its
        shell, terminal and agent protected. Without it, only the engine and its ancestors are.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pid: { type: integer }
                signal: { type: string, enum: [term, kill, stop, cont] }
                tree: { type: boolean }
                group: { type: string }
                action: { type: string, enum: [quit, force_quit, pause, resume, lower_priority, stop_builds, restart] }
                caller_pid: { type: integer, description: "The calling process's own pid; send it so the caller and its ancestors are never planned" }
                session: { type: string, description: A session id; plans its processes }
                include_agent: { type: boolean, description: "With `session`, also the agent process at its root" }
      responses:
        "200":
          description: The plan; nothing was changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  created_unix: { type: integer }
                  target: { type: string }
                  name: { type: string }
                  action: { type: string }
                  ready: { type: boolean }
                  refused: { type: string, enum: [protected, unknown_group, unknown_pid, unknown_session, restart_unavailable, no_builds, invalid_request] }
                  detail: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        request: { $ref: "#/components/schemas/Request" }
                        ready: { type: boolean }
                        reason: { type: [string, "null"] }
                  affected:
                    type: array
                    items:
                      type: object
                      properties:
                        pid: { type: integer }
                        name: { type: string }
                        start_time: { type: integer }
                        how: { type: string, enum: [signalled, exits_with_app, reniced] }
                  restart: { type: string }
        default: { $ref: "#/components/responses/Error" }
  /v1/process/execute:
    post:
      summary: Run approved process requests from a plan
      description: "Send `{\"items\": [...]}`, the `request` objects (signal, renice or reopen_app) of approved items from `POST /v1/process/plan`. Each is re-checked; a pid with a different start time is skipped. A reopen_app runs only when a signal earlier in the same request quit that pid and the process belonged to that bundle id; otherwise it is skipped with `reopen_not_quit`."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Items" }
      responses:
        "200": { $ref: "#/components/responses/Results" }
        default: { $ref: "#/components/responses/Error" }
  /v1/process/{pid}:
    get:
      summary: Everything known about one process
      description: |
        Read now. argv is redacted, and empty (with `cwd` null) for other users' processes.
        `listening` comes from the last watch run (`listening_unix`) and is null when unknown;
        `signature` is set once the watch has checked the executable (macOS).
      parameters:
        - name: pid
          in: path
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: The process
          content:
            application/json:
              schema:
                type: object
                properties:
                  pid: { type: integer }
                  ppid: { type: integer }
                  name: { type: string }
                  own: { type: boolean }
                  exe: { type: [string, "null"] }
                  cmd: { type: array, items: { type: string } }
                  cwd: { type: [string, "null"] }
                  workspace: { type: [string, "null"] }
                  workspace_label: { type: [string, "null"] }
                  group: { type: [string, "null"] }
                  kind: { type: [string, "null"], enum: [agent, build, runtime, other, null] }
                  start_time: { type: integer }
                  age_secs: { type: [integer, "null"] }
                  cpu_pct: { type: [number, "null"] }
                  mem_bytes: { type: [integer, "null"] }
                  stopped: { type: boolean }
                  parents: { type: array, items: { type: object, properties: { pid: { type: integer }, name: { type: string } } } }
                  children: { type: array, items: { type: object, properties: { pid: { type: integer }, name: { type: string }, start_time: { type: integer } } } }
                  listening: { type: [array, "null"], items: { type: string } }
                  listening_unix: { type: [integer, "null"] }
                  signature: { type: [string, "null"], enum: [apple, app_store, developer_id, development, other_signed, ad_hoc, unsigned, unknown, null] }
                  quarantined: { type: [boolean, "null"] }
                  protected: { type: [string, "null"] }
                  findings: { type: array, items: { $ref: "#/components/schemas/Finding" } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/findings:
    get:
      summary: What the watch detectors found
      description: |
        Observations, not verdicts: leftover, runaway, exposed or oddly placed processes, and
        problems with Mulchie's own setup. No malware detection, no network lookups. Updated
        on the scan loop every `watch.interval_secs`. Dismissed findings are left out unless
        `dismissed=1`.
      parameters:
        - { name: severity, in: query, required: false, description: Minimum severity, schema: { type: string, enum: [info, low, medium, high] } }
        - { name: kind, in: query, required: false, schema: { $ref: "#/components/schemas/FindingKind" } }
        - { name: dismissed, in: query, required: false, schema: { type: string, enum: ["1", "true"] } }
      responses:
        "200":
          description: The findings, most severe first
          content:
            application/json:
              schema:
                type: object
                properties:
                  findings: { type: array, items: { $ref: "#/components/schemas/Finding" } }
                  counts: { $ref: "#/components/schemas/FindingCounts" }
                  updated_unix: { type: [integer, "null"] }
                  enabled: { type: boolean }
        default: { $ref: "#/components/responses/Error" }
  /v1/findings/dismiss:
    post:
      summary: Hide a finding for a number of days
      description: Saved in the config (`watch.dismissed`). Refused with `config_not_loaded` while the config file is broken.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
                days: { type: integer, minimum: 1, maximum: 3650, default: 30 }
      responses:
        "200":
          description: Dismissed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  id: { type: string }
                  until_unix: { type: integer }
                  known: { type: boolean, description: "The id names a current finding or one dismissed before; false is probably a typo (the dismissal is saved anyway)" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/findings/undismiss:
    post:
      summary: Show a dismissed finding again
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  id: { type: string }
                  was_dismissed: { type: boolean }
        default: { $ref: "#/components/responses/Error" }
  /v1/issues:
    get:
      summary: Findings about the same problem, grouped across processes and restarts
      description: |
        An issue groups the performance and hygiene findings (the `hygiene` and `limit`
        categories) that share a fingerprint: the kind, the workspace and the command with
        paths, numbers and ids stripped (for session findings, the agent and the cap; for low
        memory, the consumer). It counts each separate finding once (`occurrences`) and keeps
        when it was first and last seen. Kept in `issues.json` in the config directory for 90
        days after it was last seen, at most 500. Unresolved issues (`open` and `regressed`)
        unless `status` is given; `status=all` lists every one. Active ones first, then the most
        recently seen. An issue is a record, never a reason for Mulchie to act.
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [open, resolved, regressed, ignored, all] } }
        - { name: kind, in: query, required: false, schema: { $ref: "#/components/schemas/FindingKind" } }
      responses:
        "200":
          description: The issues
          content:
            application/json:
              schema:
                type: object
                properties:
                  issues: { type: array, items: { $ref: "#/components/schemas/Issue" } }
                  counts: { $ref: "#/components/schemas/IssueCounts" }
        default: { $ref: "#/components/responses/Error" }
  /v1/issues/{id}:
    get:
      summary: One issue
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{16}$" } }
      responses:
        "200":
          description: The issue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/issues/resolve:
    post:
      summary: Mark an issue resolved
      description: When a new finding for it appears later, the issue becomes `regressed`, the journal says so and, with notifications on, so does a notification. Refused with `not_lock_holder` (409) by an engine that does not hold the lock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, description: The issue id from GET /v1/issues }
      responses:
        "200":
          description: The issue as it is now
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  issue: { $ref: "#/components/schemas/Issue" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/issues/ignore:
    post:
      summary: Ignore an issue
      description: It is still counted, but listed only with `status=ignored` or `status=all` and never reported as regressed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, description: The issue id from GET /v1/issues }
      responses:
        "200":
          description: The issue as it is now
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  issue: { $ref: "#/components/schemas/Issue" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/issues/reopen:
    post:
      summary: Mark an issue open again
      description: Undoes resolve or ignore.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, description: The issue id from GET /v1/issues }
      responses:
        "200":
          description: The issue as it is now
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  issue: { $ref: "#/components/schemas/Issue" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/config:
    get:
      summary: The config in use, why the file was not used (if so), and its path
      description: |
        `webhook.url` is shown redacted: its scheme, host and port, and `/[redacted]` for the
        rest (`https://hooks.slack.com/[redacted]`), since the URL may hold a secret. The same
        holds for the `config` in `GET /v1/state` and in PUT and PATCH answers.
      responses:
        "200":
          description: The config
          content:
            application/json:
              schema:
                type: object
                properties:
                  config: { type: object }
                  revision:
                    type: string
                    description: >-
                      The revision of the config file's content (16 hex digits). Send it back as
                      `If-Match` or `if_revision` on PUT or PATCH to write only if nothing changed
                      the file since.
                  config_error: { type: [string, "null"] }
                  path: { type: string }
        default: { $ref: "#/components/responses/Error" }
    put:
      summary: Replace the config
      description: |
        Send `{"config": {...}}`, the whole config from `GET /v1/config` with your changes;
        fields left out take their defaults. Validated (400 `invalid_config`) and saved
        atomically; a file that failed to load is moved aside, not overwritten. Full token only.
        When the file changed on disk since the engine loaded or wrote it (another engine, an
        editor), nothing is saved: 409 `config_changed`, and the engine takes the file's
        content. Read the config again and reapply the change. Dismissing or undismissing a
        finding instead applies its edit to the file's current content. Only the engine that
        holds the engine lock writes the config: any other answers 409 `not_lock_holder`.
        A key the config does not have is 400 `unknown_key`, naming its path (for example
        `guard.rulez`); nothing is saved.
        With a revision (`If-Match` header, quoted or not, or the `if_revision` query parameter)
        that is not the file's content now, nothing is saved: 409 `config_changed`.
        Prefer `PATCH`, which sends only the keys that change.
        A `webhook.url` equal to the redacted form of the saved URL (as `GET /v1/config` shows
        it) keeps the saved URL, so sending back what was read changes nothing. Any other
        redacted value is 400 `invalid_config`, and nothing is saved.
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
        - { $ref: "#/components/parameters/IfRevision" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config]
              properties:
                config: { type: object }
      responses:
        "200":
          description: Saved and applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  config: { type: object }
                  revision: { type: string, description: The revision of the file as saved }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      summary: Change some config keys
      description: |
        The body is a JSON merge patch (RFC 7396) of the config: objects merge key by key, `null`
        removes a key so it takes its default, anything else (arrays included) replaces. It is
        applied to the config file's current content under the config lock (an edit made
        elsewhere is kept, not refused), validated (400 `invalid_config`) and saved atomically.
        A file that failed to load is not patched (400; replace it with `PUT`). Full token only;
        409 `not_lock_holder` on an engine that does not hold the engine lock.
        A key the config does not have, at any depth, is 400 `unknown_key` naming its path
        (`watch.intervl_secs`, `limits.workspaces[0].budget.bogus`); keys set to null are not
        checked. Nothing is saved.
        With a revision (`If-Match` header or `if_revision`) that is not the file's content now,
        nothing is saved: 409 `config_changed`. Without one the patch applies to whatever the
        file holds.
        A patch that does not name `webhook.url` keeps it. Naming its redacted form (as
        `GET /v1/config` shows it) keeps it too; another redacted value is 400
        `invalid_config`. `""` or `{"webhook": null}` turns the webhook off.
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
        - { $ref: "#/components/parameters/IfRevision" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
            example: { "watch": { "interval_secs": 120 }, "limits": { "default": null } }
      responses:
        "200":
          description: Saved and applied; the whole config now in use
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  config: { type: object }
                  revision: { type: string, description: The revision of the file as saved }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/lease:
    post:
      summary: Join the build queue, poll a ticket, or renew a slot
      description: |
        A lease needs a live `pid`, a `ttl_secs`, or both. Poll with the returned `ticket` until
        `granted`. The reply that creates a ticket carries `release_secret`, which only that caller
        sees; keep it for `POST /v1/release`. The read-only token may take a lease only with
        `ttl_secs` and no `pid` (403 `read_only_token` otherwise). A `pid` of 0 or 1, another
        user's process or a dead one is refused with `pid_not_allowed`. Labels are redacted.
        Renewing or polling a ticket needs its `secret` (403 `release_secret_required` without it,
        403 `wrong_release_secret` with another). A renewal never shortens a lease's expiry and
        never adds a TTL to a pid lease.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                pid: { type: integer }
                ticket: { type: integer }
                ttl_secs: { type: integer, minimum: 1, maximum: 86400 }
                secret: { type: string, description: "With `ticket`, the `release_secret` from the reply that created it" }
      responses:
        "200":
          description: The ticket's state
          content:
            application/json:
              schema:
                type: object
                properties:
                  granted: { type: boolean }
                  ticket: { type: integer }
                  jobs: { type: integer }
                  position: { type: integer }
                  reason: { type: string }
                  expires_unix: { type: [integer, "null"] }
                  release_secret: { type: string, description: Only on the reply that created the ticket }
        default: { $ref: "#/components/responses/Error" }
  /v1/release:
    post:
      summary: Release a slot or leave the queue
      description: >-
        With the read-only token, a lease with a release secret needs it; without it the reply is
        403 `release_secret_required`. With the full token and no `secret`, any lease or waiter is
        released (an admin release, for a holder that crashed with its secret); it is journaled as
        such and the reply has `admin: true`. A wrong secret is always 403 `wrong_release_secret`.

        The caller may say how the work done with the slot went (`duration_ms`, `exit_code`,
        `command`, `cwd`). When the release frees a ticket and `duration_ms` is given, the engine
        records it as a timing (see `GET /v1/timings`): it adds the workspace holding `cwd`, its
        branch and `HEAD`, and the agent session, and redacts the command. The reply's
        `timing_recorded` says whether it was taken; a timing that is refused never stops the
        release.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket]
              properties:
                ticket: { type: integer }
                secret: { type: string, description: The `release_secret` from the reply that created the ticket }
                duration_ms: { type: integer, minimum: 0, maximum: 604800000, description: "How long the command ran, in milliseconds (not the wait for the slot)" }
                exit_code: { type: integer, description: "The command's exit code; only runs with 0 count toward its usual time" }
                command: { type: string, description: "The command line (at most 64 KiB; redacted and cut to 1024 characters before it is stored)" }
                cwd: { type: string, description: "The absolute directory the command ran in (at most 4096 bytes)" }
      responses:
        "200":
          description: Released
          content:
            application/json:
              schema:
                type: object
                properties:
                  released: { type: boolean }
                  admin: { type: boolean, description: "Released by the full token without the secret (present only when no secret was sent with the full token)" }
                  timing_recorded: { type: boolean, description: "Present when `duration_ms` was sent: whether the timing was queued to be recorded" }
                  timing_error: { type: string, description: "Why the timing was not recorded (nothing released, or a bad field)" }
        default: { $ref: "#/components/responses/Error" }
  /v1/sessions:
    get:
      summary: Agent sessions, running first, newest first
      description: |
        A session is an agent process and everything it started, keyed `s-<start time>-<pid>`.
        Sessions are found from the process table on each sample (`source: detected`) or
        registered by `POST /v1/hook` (`source: hook`). Ended sessions are kept for a while.
        `write_bytes_available` says whether per-process disk writes can be read on this system.
      responses:
        "200":
          description: The sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean, description: "`sessions.enabled` in config" }
                  write_bytes_available: { type: boolean }
                  sessions: { type: array, items: { $ref: "#/components/schemas/Session" } }
        default: { $ref: "#/components/responses/Error" }
  /v1/sessions/{id}:
    get:
      summary: One session with its processes, breaches and paused processes
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: "^s-[0-9]+-[0-9]+$" } }
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { $ref: "#/components/schemas/Session" }
                  processes:
                    type: array
                    description: Members at the last sample. Command lines are redacted.
                    items:
                      type: object
                      properties:
                        pid: { type: integer }
                        ppid: { type: integer }
                        start_time: { type: integer }
                        name: { type: string }
                        cmd: { type: string }
                        cpu_pct: { type: number }
                        mem_bytes: { type: integer }
                        stopped: { type: boolean }
                        root: { type: boolean }
                  breaches: { type: array, items: { $ref: "#/components/schemas/Breach" } }
                  paused_by_mulchie: { type: array, items: { $ref: "#/components/schemas/PausedProc" } }
        "400": { description: "`invalid_session_id`", content: { application/json: { schema: { type: object } } } }
        "404": { description: "`unknown_session`", content: { application/json: { schema: { type: object } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/sessions/{id}/events:
    get:
      summary: A session's activity record
      description: |
        Events with `seq` above `since`, oldest first, from `<config dir>/sessions/`. Written only
        by the engine holding the lock, and only while `sessions.enabled`. Every command line and
        hook payload is redacted before it is stored. Pass `next_since` back as `since` to page.
        A session that is neither known nor recorded is 404 `unknown_session`.

        Every limit action is a `limit_action` event: `breach_id`, `cap`, `action` (the cap's
        action), `outcome` (`paused`, `stopped`, `killed`, `deprioritized`, `resumed`, `restored`,
        `restore_failed` or `refused`), `state` (the breach's `action_state`), `detail`, and
        `reason` when refused. `cap`, `action` and `state` are null for a resume whose breach is
        gone (sessions or limits were turned off).

        To read backwards, pass `tail=N` for the last N events, then `before=<prev_before>` for
        the page before that; events are still oldest first. `prev_before` is null when the page
        starts at the first event. `before` without `tail` takes `limit` events. `since` does not
        combine with `tail` or `before` (400 `invalid_query`).

        A read waits for events still queued for the writer at most 250 ms, and seeks through an
        index of byte offsets (one per 128 events), so it never reads the record from the start.
        A record that is a symlink, FIFO or hard link is refused (500 `record_unreadable`).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: "^s-[0-9]+-[0-9]+$" } }
        - { name: since, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
        - { name: tail, in: query, required: false, description: The last N events (below `before` when given), schema: { type: integer, minimum: 1, maximum: 1000 } }
        - { name: before, in: query, required: false, description: Only events with `seq` below this, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: The events
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: { type: string }
                  next_since: { type: integer }
                  prev_before:
                    type: [integer, "null"]
                    description: "`before` for the page of older events; null at the start of the record"
                  events:
                    type: array
                    items:
                      type: object
                      required: [seq, t, type]
                      properties:
                        seq: { type: integer }
                        t: { type: integer, description: Unix seconds }
                        type: { type: string, description: "e.g. session_start, session_end, breach, limit_action, hook_prompt, hook_pre_tool" }
        "400": { description: "`invalid_session_id` or `invalid_query`", content: { application/json: { schema: { type: object } } } }
        "404": { description: "`unknown_session`", content: { application/json: { schema: { type: object } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/limits/status:
    get:
      summary: Session budgets, breaches, hogs, processes Mulchie paused and the memory guard
      description: |
        `report_only` is true when no cap acts (every action is `notify`). `enforcing` is false
        on an engine that does not hold the lock: it reports and never acts. Every limit action
        goes through the safety gate with the start time that was observed, and is journaled.
      responses:
        "200":
          description: The status
          content:
            application/json:
              schema:
                type: object
                properties:
                  report_only: { type: boolean }
                  enforcing: { type: boolean }
                  not_enforcing_reason:
                    type: string
                    enum: [not_lock_holder, config_error]
                    description: >-
                      Present when `enforcing` is false. `not_lock_holder`: another engine holds
                      the engine lock (it acts; this one reports). `config_error`: the config file
                      did not load, so nothing acts until it is fixed.
                  config: { type: object, description: The `limits` section of config }
                  breaches: { type: array, items: { $ref: "#/components/schemas/Breach" } }
                  hogs:
                    type: array
                    items:
                      type: object
                      properties:
                        session_id: { type: string }
                        agent: { type: string }
                        resource: { type: string, enum: [cpu, memory] }
                        share_pct: { type: number }
                        since_unix: { type: integer }
                  paused_by_mulchie: { type: array, items: { $ref: "#/components/schemas/PausedProc" } }
                  paused_left: { type: array, items: { $ref: "#/components/schemas/PausedProc" }, description: Paused processes Mulchie could not resume }
                  memory_guard: { $ref: "#/components/schemas/MemoryGuardStatus" }
                  runaway: { $ref: "#/components/schemas/RunawayStatus" }
        default: { $ref: "#/components/responses/Error" }
  /v1/hook:
    post:
      summary: An agent hook reports an event and gets advice
      description: |
        For agent hooks (`mulchie hook`). `pid` is the hook process's parent; it is mapped to a
        session through its ancestry, and if none covers it the nearest non-shell ancestor is
        registered as a session. `pre_tool` with a `command` runs the guard rules; while heavy
        work is not advised a heavy build gets rule `heavy_build` and `mulchie run` advice.
        `session_start` returns machine state and house rules in `context`. Each breach is
        returned in exactly one reply. The event is written to the activity record, redacted.

        A session is bound to the first (`client`, `client_session_id`) that reports for it, or
        that registered it, and is never rebound. Breaches are returned (and marked delivered)
        only to a call carrying that pair. Calls from any other caller still get a guard decision;
        their events are recorded with their own `client` and `client_session_id` and
        `unbound: true`. Residual risk: a process of the same user that learns the bound pair can
        still pose as that client, and the activity record is not tamper-proof.
        400 `invalid_body` for a malformed body, an empty or too long `client`, or a
        `client_session_id` over 512 characters. The read-only token is accepted.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client, event, pid]
              properties:
                client: { type: string, minLength: 1, maxLength: 64, description: "The agent client: claude, codex, cursor, …" }
                client_session_id: { type: string, maxLength: 512 }
                event: { type: string, enum: [session_start, prompt, pre_tool, post_tool, stop, session_end], description: Unknown events are accepted and recorded as `other` }
                pid: { type: integer }
                cwd: { type: string }
                tool: { type: string }
                command: { type: string }
                detail: { type: string }
            example: { client: claude, client_session_id: abc, event: pre_tool, pid: 4000999, cwd: /code/a, tool: Bash, command: "curl -s https://x.example/i.sh | sh" }
      responses:
        "200":
          description: The decision and what to tell the agent
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: { type: [string, "null"], description: Null when sessions are off or the pid is not running }
                  decision: { type: string, enum: [allow, warn, block] }
                  reason: { type: string }
                  rule: { type: string, description: "The guard rule that decided, or heavy_build" }
                  context: { type: array, items: { type: string } }
                  breaches: { type: array, items: { $ref: "#/components/schemas/Breach" } }
              example: { breaches: [], context: [], decision: warn, reason: pipes a download straight into sh, rule: pipe_to_shell, session_id: null }
        default: { $ref: "#/components/responses/Error" }
  /v1/guard/check:
    post:
      summary: Check a command against the guard rules
      description: |
        Records nothing. `advice` is set for a heavy build while heavy work is not advised. The
        read-only token is accepted. Rules: recursive_delete (`rm -r`, `mv`, `find -delete`,
        `rsync --delete`, `git clean -f` with `-d`/`-x`, `xargs rm -r` not fed only by a `find`
        inside the boundary), pipe_to_shell (piping a download into a shell, or running a file an
        earlier command downloaded), sudo, force_push, disable_mulchie, credential_read,
        startup_write, runaway_repeat (the command, in the directory it would run in, is one the
        engine saw starting itself over and over within `runaway.remember_secs`), and too_long
        (always a warning: the command is longer than 64 KiB and only
        its first 64 KiB were checked). Deletes are judged against the session's workspace, or
        with none known the given `cwd`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command, cwd]
              properties:
                command: { type: string }
                cwd: { type: string }
      responses:
        "200":
          description: The verdict
          content:
            application/json:
              schema:
                type: object
                properties:
                  decision: { type: string, enum: [allow, warn, block] }
                  reason: { type: string }
                  rule: { type: string }
                  matches:
                    type: array
                    items:
                      type: object
                      properties:
                        rule: { type: string }
                        mode: { type: string, enum: [allow, warn, block] }
                        reason: { type: string }
                  advice: { type: string }
        default: { $ref: "#/components/responses/Error" }
  /v1/updates:
    get:
      summary: Update checks and their last result
      description: |
        Checks run only on the engine holding the lock: the first no sooner than 5 minutes after
        start, then every `updates.interval_hours`, sooner after errors. Sources: the Mulchie
        release on GitHub, agent tools' versions against npm, Homebrew's local data, and OSV.dev for
        packages in workspace lockfiles. With `updates.check: off` nothing is requested or run.
        Agent tools are looked for in absolute `PATH` directories outside the workspaces and scan
        roots and are never run: their installed version comes from package metadata. `brew
        outdated` runs with a minimal `PATH`, `HOMEBREW_NO_AUTO_UPDATE=1` and
        `HOMEBREW_NO_INSTALL_FROM_API=1`, and only when the local homebrew/core tap exists.
      responses:
        "200":
          description: The status
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  checking: { type: boolean }
                  checked_unix: { type: [integer, "null"] }
                  next_check_unix: { type: [integer, "null"] }
                  failures: { type: integer, description: Consecutive checks with errors }
                  available: { type: integer, description: Open findings of category `update` }
                  errors: { type: array, items: { type: string } }
                  report:
                    type: object
                    description: >-
                      The last check in full. Each tool in `agents` (and `mulchie`) has `path` (the
                      binary found), `installed`, `latest`, `outdated`, `command`, `source` and
                      `version_from` (where `installed` was read: `package.json at …` or
                      `install path …`, or why it is unknown; agent tools are never run).
                      `homebrew_path` is the `brew` that was run, when it was. `homebrew_skipped` is present
                      only when Homebrew was not checked: `off`, `no_brew` or `no_core_tap`; a skipped
                      check drops any earlier Homebrew result, while a `brew outdated` that ran and
                      failed keeps the last one and adds an entry to `errors`.
        default: { $ref: "#/components/responses/Error" }
  /v1/updates/check:
    post:
      summary: Ask for an update check now
      description: The check runs on the engine's update worker; poll `GET /v1/updates`. Full token only.
      responses:
        "200":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  queued: { type: boolean }
        "409": { description: "`updates_off`: `updates.check` is off", content: { application/json: { schema: { type: object } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/feedback:
    get:
      summary: Feedback reports, newest first
      parameters:
        - name: limit
          in: query
          required: false
          description: "How many to return (1 to 1000, default 50)"
          schema: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        "200":
          description: The newest reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  feedback:
                    type: array
                    items: { $ref: "#/components/schemas/Feedback" }
                  total: { type: integer, description: Reports stored in all }
                  path: { type: string, description: The feedback file }
        default: { $ref: "#/components/responses/Error" }
    post:
      summary: Report a problem with Mulchie or the machine
      description: |
        Adds one line to `<config dir>/feedback.jsonl` (private to the user; renamed to
        `feedback.jsonl.1` at 4 MB) with the machine's state from the last sample, and a `feedback`
        entry to the action journal. Secrets in the text are hidden word by word. Nothing is sent
        anywhere. The read-only token is accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [summary]
              additionalProperties: false
              properties:
                summary: { type: string, description: "One or two sentences; kept to 500 characters" }
                category:
                  type: string
                  enum: [bug, wrong_advice, false_positive, missed, blocked, slow, environment, idea, other]
                  default: other
                severity: { type: string, enum: [low, medium, high], default: medium }
                details: { type: string, description: Kept to 8000 characters }
                tool: { type: string, description: "The Mulchie tool, command or route it is about" }
                client: { type: string, description: "Who reports, such as an agent's name" }
                cwd: { type: string }
                source: { type: string, description: "`mcp` or `cli` when a Mulchie front end passes the report on; otherwise stored as `api`" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  feedback: { $ref: "#/components/schemas/Feedback" }
        "400": { description: "`invalid_body`: no summary, an unknown category or severity, or an unknown field", content: { application/json: { schema: { type: object } } } }
        "500": { description: "`feedback_not_saved`: the file could not be written", content: { application/json: { schema: { type: object } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/commits:
    get:
      summary: Recorded moves of workspaces' HEAD, with the agent session working there, newest first
      description: |
        The engine that holds the lock reads `HEAD` (branch and commit) of each workspace an agent
        session works in, or recently worked in, every `perf.head_check_secs`, and right after a
        hook reports a shell command running `git commit`, `merge`, `rebase`, `cherry-pick`, `pull`
        or `am`. Each move is one entry in `<config dir>/commits.jsonl`. An entry is a move of
        `HEAD`, not a commit: one pull that brings many commits is one entry. The session is the one
        the hook named, else the session working in that workspace that was active last: a
        heuristic, not proof of authorship. The first entry of a workspace has no `previous_head`
        and no session.
      parameters:
        - name: workspace
          in: query
          required: false
          description: Only this workspace (absolute path, percent-encoded)
          schema: { type: string }
        - name: since
          in: query
          required: false
          description: Only moves at or after this unix time
          schema: { type: integer, minimum: 0 }
        - name: limit
          in: query
          required: false
          description: "How many to return (1 to 1000, default 100)"
          schema: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        "200":
          description: The moves
          content:
            application/json:
              schema:
                type: object
                properties:
                  commits:
                    type: array
                    items: { $ref: "#/components/schemas/CommitEntry" }
                  total: { type: integer, description: How many matched before the limit }
        "400": { description: "`invalid_query`: a bad limit, since or workspace", content: { application/json: { schema: { type: object } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/timings:
    get:
      summary: Build and test timings, newest first
      description: |
        One entry per timing sent with `POST /v1/release` (`mulchie run` sends one for every
        command), with the workspace holding its `cwd` (or `cwd` itself when it is in no checkout),
        branch, `HEAD` and agent session added by the engine, kept in `<config dir>/timings.jsonl`.
        A command whose latest successful runs each take much longer than usual raises a
        `build_slower` finding (settings under `perf`).
      parameters:
        - name: workspace
          in: query
          required: false
          description: Only this workspace (absolute path, percent-encoded)
          schema: { type: string }
        - name: command
          in: query
          required: false
          description: "Only commands whose grouping key contains this, normalized the same way (percent-encoded)"
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: "How many to return (1 to 1000, default 50)"
          schema: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        "200":
          description: The timings
          content:
            application/json:
              schema:
                type: object
                properties:
                  timings:
                    type: array
                    items: { $ref: "#/components/schemas/Timing" }
                  total: { type: integer, description: How many matched before the limit }
        "400": { description: "`invalid_query`: a bad limit, workspace or command", content: { application/json: { schema: { type: object } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/devservers:
    get:
      summary: Each project's dev server, run by run, newest first
      description: |
        A dev server is a process of the user's in a workspace that listens on a TCP port (`next
        dev`, `vite`, `rails s`, a web app run with `cargo run`), found from the process table and
        the listening sockets the watch already reads. Each run (a pid and its start time) is
        recorded when it ends and every 30 minutes while it lasts, in
        `<config dir>/devservers.jsonl`; a run seen listening for under a minute is not. The
        runs alive now come as they stand; the others as their newest record says.
        `listen_ms` is an upper bound: it is read from the watch run (`watch.interval_secs`, 60
        by default) that first saw the port, and the true time lies within
        `listen_uncertainty_ms` below it. It is absent when Mulchie first met the process already
        listening. Latest runs that each start much slower or settle at much more memory than
        usual raise `dev_server_slow_start` and `dev_server_heavier` findings (settings under
        `perf`). Nothing acts on a run or a finding.
      parameters:
        - name: workspace
          in: query
          required: false
          description: Only this workspace (absolute path, percent-encoded)
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: "How many to return (1 to 1000, default 50)"
          schema: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        "200":
          description: The runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  dev_servers:
                    type: array
                    items: { $ref: "#/components/schemas/DevServer" }
                  total: { type: integer, description: How many matched before the limit }
        "400": { description: "`invalid_query`: a bad limit or workspace", content: { application/json: { schema: { type: object } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/otel:
    get:
      summary: The trace receiver and the endpoints of the apps sending traces
      description: |
        With `otel.enabled` on, the engine that holds the lock receives OpenTelemetry traces
        (OTLP/HTTP `POST /v1/traces`, JSON or protobuf, uncompressed) on `127.0.0.1:<otel.port>`.
        Server, consumer and root spans are aggregated per `service.name` and operation (the HTTP
        method and route, else the span name) in 5-minute windows kept for 24 hours. This returns
        the receiver's status and, per service, each operation with requests in the last
        `minutes`: count, errors, p50/p95/p99, its baseline (the median p95 and error rate of the
        earlier windows with at least `otel.min_requests` requests) and whether it is slower or
        failing more than that. `attribution` says where the service runs (its `process.pid`'s
        working directory, else its `vcs.ref.head.revision` matched against recorded commits),
        the commit and the agent session that moved HEAD to it; it is refreshed once a minute.
        Endpoints slower or failing more over the last 15 minutes raise `endpoint_slower` and
        `endpoint_errors` findings. Nothing acts on them.
      parameters:
        - name: service
          in: query
          required: false
          description: Only this service (percent-encoded)
          schema: { type: string }
        - name: minutes
          in: query
          required: false
          description: "The range of the figures, in minutes (1 to 1440, default 15)"
          schema: { type: integer, minimum: 1, maximum: 1440 }
      responses:
        "200":
          description: The receiver and its services
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean, description: "`otel.enabled`" }
                  listening: { type: boolean, description: "This engine's receiver is listening" }
                  port: { type: integer, nullable: true, description: "The port it listens on (with `otel.port` 0, the one picked)" }
                  configured_port: { type: integer, description: "`otel.port`" }
                  endpoint: { type: string, nullable: true, description: "The URL to export to (OTEL_EXPORTER_OTLP_ENDPOINT)" }
                  error: { type: string, nullable: true, description: Why it is not listening while enabled }
                  minutes: { type: integer }
                  thresholds:
                    type: object
                    properties:
                      ratio: { type: number, description: "`perf.slower_ratio`" }
                      min_slowdown_ms: { type: number, description: "`otel.min_slowdown_ms`" }
                      min_requests: { type: integer, description: "`otel.min_requests`" }
                  received_spans: { type: integer }
                  recorded_spans: { type: integer }
                  ignored_spans: { type: integer, description: "Spans that are neither server, consumer nor root" }
                  drops: { type: object, description: "Spans not recorded, by reason (services, operations, cells, too_old, invalid, spans_over_request_cap, attributes, truncated_strings)" }
                  services:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        first_seen_ms: { type: integer }
                        last_seen_ms: { type: integer }
                        resource: { $ref: "#/components/schemas/TraceResource" }
                        attribution: { $ref: "#/components/schemas/EndpointAttribution" }
                        operations:
                          type: array
                          description: Operations with requests in the range, slowest p95 first
                          items:
                            type: object
                            properties:
                              operation: { type: string }
                              count: { type: integer }
                              errors: { type: integer }
                              p50_ms: { type: number }
                              p95_ms: { type: number }
                              p99_ms: { type: number }
                              mean_ms: { type: number }
                              max_ms: { type: number }
                              error_rate: { type: number, description: "0 to 1" }
                              baseline:
                                type: object
                                nullable: true
                                description: Null without three busy windows before the range
                                properties:
                                  p95_ms: { type: number }
                                  error_rate: { type: number }
                                  windows: { type: integer }
                                  from_ms: { type: integer }
                                  to_ms: { type: integer }
                                  revision: { type: string }
                              slower: { type: boolean }
                              more_errors: { type: boolean }
                              resource: { $ref: "#/components/schemas/TraceResource" }
        "400": { description: "`invalid_query`: a bad service or minutes", content: { application/json: { schema: { type: object } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/integrations:
    get:
      summary: Connected providers (Vercel, Sentry, PostHog) and how their last poll went
      description: |
        Every provider is off until the user turns it on (`integrations.<provider>.enabled`, set by
        `mulchie integrations add`). Only the engine holding the lock polls, each enabled provider no
        sooner than a minute after start and then every `integrations.interval_mins` (at least 15),
        doubling after each failed poll up to a day. A poll is authenticated read requests over HTTPS
        to that provider's own API host, with no redirects followed; nothing about this machine is
        sent. Tokens are never in this response: `token` only says whether a token file is in place.
      responses:
        "200":
          description: The status
          content:
            application/json:
              schema:
                type: object
                properties:
                  network: { type: boolean, description: "This build has network support (the `network` feature)" }
                  interval_mins: { type: integer }
                  checking: { type: boolean }
                  slower: { type: integer, description: "Open `production_slower` findings" }
                  sends: { type: string, description: "What goes over the network, in words" }
                  providers:
                    type: array
                    items:
                      type: object
                      properties:
                        provider: { type: string, enum: [vercel, sentry, posthog] }
                        enabled: { type: boolean }
                        host: { type: string, description: The one API host requests go to }
                        project: { type: string, description: The project identifiers from the config }
                        token: { type: boolean, description: A token file is in place }
                        last_attempt_unix: { type: integer }
                        last_success_unix: { type: integer }
                        last_error: { type: string, description: "Why the last poll failed, in words" }
                        failures: { type: integer }
                        next_poll_unix: { type: integer }
                        deploys: { type: integer }
        default: { $ref: "#/components/responses/Error" }
  /v1/integrations/check:
    post:
      summary: Ask for a poll of every enabled provider now
      description: The poll runs on the engine's integrations worker; read `GET /v1/deploys` after it. Full token only.
      responses:
        "200":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  queued: { type: boolean }
        "409": { description: "`integrations_off`: no provider is on; `no_network`: this build has no network support; `too_soon`: the last poll was less than a minute ago", content: { application/json: { schema: { type: object } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/deploys:
    get:
      summary: Recent deploys of the enabled providers, newest first, with their numbers and commits
      description: |
        The deploys of the last successful poll of each enabled provider. Vercel: production
        deployments in state READY and their build duration (Vercel's API offers no per-deployment
        latency). Sentry: releases and the p95 of transaction durations per release over the last
        30 days. PostHog: values of the release property on `$web_vitals` events and their LCP and
        INP at the 75th percentile. Each deploy lists the moves of HEAD this machine recorded from the
        previous deploy's commit to its own, with the agent session that was working then, or
        `made_elsewhere`. A deploy that made a number worse raises a `production_slower` finding.
      parameters:
        - name: provider
          in: query
          required: false
          description: Only this provider
          schema: { type: string, enum: [vercel, sentry, posthog] }
      responses:
        "200":
          description: The deploys
          content:
            application/json:
              schema:
                type: object
                properties:
                  deploys:
                    type: array
                    items: { $ref: "#/components/schemas/Deploy" }
        "400": { description: "`bad_provider`", content: { application/json: { schema: { type: object } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/webhook:
    get:
      summary: The issue webhook's settings and what it sent
      description: |
        The webhook posts issue events (`new_issue`, `regressed`, `resolved_by_user`) to
        `webhook.url`. Nothing is sent while it is empty, the default. Only the engine that holds
        the lock, in a build with network support, sends (`sending`). The URL is shown only
        redacted. Errors name the redacted URL and the status or reason, never the URL.
      responses:
        "200":
          description: The status
          content:
            application/json:
              schema:
                type: object
                properties:
                  network: { type: boolean, description: "This build can send (the `network` feature)" }
                  configured: { type: boolean, description: "`webhook.url` is set" }
                  url: { type: string, description: "Scheme, host and port, then `/[redacted]`; empty when not set" }
                  format: { type: string, enum: [json, slack] }
                  events:
                    type: array
                    items: { type: string, enum: [new_issue, regressed, resolved_by_user] }
                  min_severity: { type: string, enum: [info, low, medium, high] }
                  include_host: { type: boolean }
                  sending: { type: boolean, description: "This engine sends (it holds the lock and has network support)" }
                  queued: { type: integer }
                  sent: { type: integer }
                  failed: { type: integer }
                  dropped: { type: integer, description: "Events dropped because the queue (64) was full" }
                  last_sent_unix: { type: integer }
                  last_event: { type: string, enum: [new_issue, regressed, resolved_by_user, test] }
                  last_error: { type: string, description: "Why the last send failed, with the URL redacted" }
                  last_error_unix: { type: integer }
                  sends: { type: string, description: "What is sent, in words" }
        default: { $ref: "#/components/responses/Error" }
  /v1/webhook/test:
    post:
      summary: Post one test event to the webhook now
      description: |
        Posts `{"event": "test", "message": ...}` (or, with format `slack`, `{"text": ...}`) to
        `webhook.url` once, with a 10 s timeout and no redirect followed, and answers with the
        webhook's HTTP status. Full token only.
      responses:
        "200":
          description: The webhook answered with a 2xx
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  status: { type: integer, description: The webhook's HTTP status }
        "409": { description: "`webhook_off`: webhook.url is not set; `no_network`: this build has no network support; `not_lock_holder`: this engine does not send", content: { application/json: { schema: { type: object } } } }
        "502": { description: "`webhook_failed`: no 2xx answer; the message names the redacted URL and the status or reason", content: { application/json: { schema: { type: object } } } }
        default: { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: The token from `<config dir>/token`, or the read-only one from `<config dir>/token.read`.
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: The `revision` from `GET /v1/config`; the write happens only while the file is at it
      schema: { type: string }
    IfRevision:
      name: if_revision
      in: query
      required: false
      description: The same as `If-Match`, for clients that cannot set headers
      schema: { type: string }
  responses:
    Json:
      description: A JSON object
      content:
        application/json:
          schema: { type: object }
    Plan:
      description: A plan; nothing was changed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Plan" }
    Results:
      description: One result per item, in order
      content:
        application/json:
          schema:
            type: array
            items: { $ref: "#/components/schemas/ActionResult" }
    Error:
      description: "An error: 400 bad body, 401 bad token, 403 refused origin, host or read-only token, 404, 405, 409, 413, 500"
      content:
        application/json:
          schema:
            type: object
            required: [error, code]
            properties:
              error: { type: string }
              code: { type: string, description: "A stable code, e.g. unauthorized, read_only_token, items_required, invalid_body" }
  schemas:
    Feedback:
      type: object
      properties:
        id: { type: string, description: "`fb-<unix seconds>-<random>`" }
        at_unix: { type: integer }
        source: { type: string, enum: [api, mcp, cli] }
        category: { type: string }
        severity: { type: string }
        summary: { type: string }
        details: { type: string }
        tool: { type: string }
        client: { type: string }
        cwd: { type: string }
        mulchie_version: { type: string }
        os: { type: string }
        machine:
          type: object
          description: "The machine at the last sample; absent when no engine took the report"
          properties:
            health: { type: string }
            cpu_pct: { type: number }
            load1: { type: number }
            cores: { type: integer }
            mem_free_pct: { type: number }
            disk_free_gb: { type: number }
            sessions: { type: integer }
    Health:
      type: string
      enum: [good, busy, strained, critical, stale]
    Items:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Request" } }
        auto: { type: boolean }
    Request:
      description: One action, as found in a plan item's `request`. Send it back unchanged.
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [delete_cache, remove_worktree, prune_worktree, signal, renice, reopen_app] }
        path: { type: string }
        require_stale: { type: boolean }
        expected_head: { type: string }
        allow_dirty: { type: boolean }
        require_idle: { type: boolean }
        repo: { type: string }
        pid: { type: integer }
        signal: { type: string, enum: [term, kill, stop, cont] }
        expected_start_time: { type: integer }
        nice: { type: integer, description: For renice; only lowers priority }
        bundle_id: { type: string, description: For reopen_app (macOS `open -b`) }
        after_pid: { type: integer }
        after_start_time: { type: integer }
    Plan:
      type: object
      properties:
        created_unix: { type: integer }
        ready_bytes: { type: integer }
        items:
          type: array
          items:
            type: object
            properties:
              request: { $ref: "#/components/schemas/Request" }
              target: { type: string }
              name: { type: string }
              repo_name: { type: [string, "null"] }
              head: { type: [string, "null"] }
              branch: { type: [string, "null"] }
              bytes: { type: integer }
              dirty_files: { type: integer }
              idle_days: { type: [integer, "null"] }
              ignored_files: { type: integer }
              ignored_bytes: { type: integer }
              would_backup: { type: array, items: { type: string } }
              ready: { type: boolean }
              reason: { type: [string, "null"] }
              verdict: { type: string }
              past_failures:
                type: object
                description: >-
                  Present when this target was skipped at least twice in a row before. The
                  item can still be executed.
                properties:
                  count: { type: integer }
                  reason: { type: [string, "null"] }
                  detail: { type: string }
                  last_unix: { type: integer }
                  advice: { type: string }
    ActionResult:
      type: object
      required: [action, target, status]
      properties:
        action: { type: string, enum: [delete_cache, remove_worktree, prune_worktree, signal, renice, reopen_app] }
        target: { type: string }
        status: { type: string, enum: [done, skipped] }
        freed_bytes: { type: integer }
        backups:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [patch, ignored_archive, branch] }
              location: { type: string, description: "A file path, or a branch name for kind branch" }
        reason:
          type: string
          description: >-
            Why it was skipped. `backing_off` is returned only by the automatic passes
            (`{"auto": true}`), for a target that was skipped three or more times in a row
            and is inside its wait; it was not run. `operation_in_progress` means a worktree
            is in the middle of a rebase, merge, cherry-pick, revert or bisect.
        detail: { type: string }
        journal_error: { type: string, description: Set when the action ran but could not be written to the journal }
    FindingKind:
      type: string
      enum:
        - orphaned_process
        - missing_working_directory
        - executable_changed
        - stale_process
        - stopped_process
        - runaway_cpu
        - growing_memory
        - exposed_listener
        - temp_executable
        - hidden_dir_executable
        - system_name_mismatch
        - unsigned_executable
        - quarantined_executable
        - insecure_permissions
        - api_exposed
        - engine_lock_not_held
        - config_not_loaded
        - limit_exceeded
        - session_hog
        - mulchie_update
        - agent_update
        - homebrew_outdated
        - advisory
        - paused_list_unreadable
        - memory_low
        - runaway_chain
        - orphan_swarm
        - build_slower
        - endpoint_slower
        - endpoint_errors
        - otel_unavailable
        - dev_server_slow_start
        - dev_server_heavier
        - production_slower
    TraceResource:
      type: object
      description: The resource attributes kept from a service's spans
      properties:
        pid: { type: integer, description: "`process.pid` (dropped when posted as host.docker.internal)" }
        service_version: { type: string }
        vcs_revision: { type: string, description: "`vcs.ref.head.revision`, else `vcs.repository.ref.revision`" }
        deployment_environment: { type: string }
    EndpointAttribution:
      type: object
      nullable: true
      description: Where a service runs; null when not found
      required: [via]
      properties:
        workspace: { type: string, description: The checkout the service runs from }
        branch: { type: string }
        head: { type: string, description: "The commit it runs: the app's revision, else the workspace's HEAD" }
        session_id: { type: string, description: The agent session working there when HEAD moved to it }
        agent: { type: string }
        via: { type: string, enum: [pid, revision] }
    DeployCommit:
      type: object
      required: [sha, made]
      properties:
        sha: { type: string, description: The commit HEAD moved to }
        at_unix: { type: integer }
        branch: { type: string }
        session_id: { type: string }
        agent: { type: string }
        made:
          type: string
          enum: [session, no_session, made_elsewhere]
          description: "`made_elsewhere`: this machine never recorded the commit"
    Deploy:
      type: object
      required: [provider, id, at_unix, metrics, commits]
      properties:
        provider: { type: string, enum: [vercel, sentry, posthog] }
        id: { type: string, description: "A Vercel deployment id, or a Sentry or PostHog release" }
        sha: { type: string, description: "The commit it was built from, when the provider says" }
        at_unix: { type: integer, description: "Created or released (PostHog: first seen)" }
        metrics:
          type: array
          items:
            type: object
            required: [metric, value_ms]
            properties:
              metric: { type: string, enum: [build_duration, p95, lcp_p75, inp_p75] }
              value_ms: { type: number }
              samples: { type: integer }
        previous_deploy_id: { type: string }
        workspace: { type: string, description: Where the commits were recorded }
        commits:
          type: array
          description: "The recorded moves of HEAD from the previous deploy's commit to this one's (at most 20, the newest)"
          items: { $ref: "#/components/schemas/DeployCommit" }
        commits_truncated: { type: boolean }
    CommitEntry:
      type: object
      required: [at_unix, workspace, head, via]
      properties:
        at_unix: { type: integer }
        workspace: { type: string, description: "The checkout's top directory" }
        branch: { type: string, description: Absent when HEAD is detached }
        head: { type: string, description: The commit HEAD points to now }
        previous_head: { type: string, description: "Where it pointed at the check before; absent for a workspace's first entry" }
        session_id: { type: string }
        agent: { type: string }
        via: { type: string, enum: [poll, hook, timing, otel, devserver], description: What noticed the move }
    Timing:
      type: object
      required: [at_unix, duration_ms, command, key, label]
      properties:
        at_unix: { type: integer }
        duration_ms: { type: integer }
        exit_code: { type: integer, description: Absent when the caller did not say; only 0 counts as successful }
        command: { type: string, description: "Redacted, at most 1024 characters" }
        key: { type: string, description: "The command as runs are grouped (paths cut to their last part, numbers replaced by #)" }
        label: { type: string, description: "The build slot's label" }
        cwd: { type: string }
        workspace: { type: string, description: "The checkout holding cwd, or cwd itself when it is in no checkout" }
        branch: { type: string }
        head: { type: string }
        session_id: { type: string }
        agent: { type: string }
    DevServer:
      type: object
      required: [at_unix, pid, start_unix, workspace, command, key, end]
      properties:
        at_unix: { type: integer, description: When the record was written }
        pid: { type: integer }
        start_unix: { type: integer, description: "The process's start; with pid it identifies the run" }
        workspace: { type: string }
        branch: { type: string }
        head: { type: string, description: "The workspace's HEAD when Mulchie first saw the run listening" }
        session_id: { type: string }
        agent: { type: string }
        command: { type: string, description: "Redacted, at most 1024 characters" }
        key: { type: string, description: "The command as runs are grouped" }
        ports: { type: array, items: { type: integer }, description: "The ports it listened on (the first 8)" }
        listen_ms: { type: integer, description: "Process start to the first watch run that saw it listening: an upper bound. Absent when Mulchie first met it already listening" }
        listen_uncertainty_ms: { type: integer, description: "The true time to listen is within this much below listen_ms" }
        watch_interval_secs: { type: integer, description: "watch.interval_secs when it was measured" }
        settled_mem_bytes: { type: integer, description: "Median memory of the process and its descendants over minutes 2 to 5 of the run (at least 3 samples)" }
        mem_slope_mb_per_hour: { type: number, description: "Least-squares slope of that memory from minute 2 on; absent before 10 minutes were watched" }
        peak_cpu_pct: { type: number, description: "Percent of one core, the process tree summed, at sample resolution" }
        peak_mem_bytes: { type: integer }
        processes: { type: integer, description: Processes in the tree at the last sample }
        run_secs: { type: integer, description: "From the start to the last sample that saw it" }
        end: { type: string, enum: [running, exited] }
    FindingCounts:
      type: object
      properties:
        info: { type: integer }
        low: { type: integer }
        medium: { type: integer }
        high: { type: integer }
        dismissed: { type: integer }
    IssueCounts:
      type: object
      properties:
        open: { type: integer }
        regressed: { type: integer }
        active: { type: integer, description: Unresolved and current now }
    Issue:
      type: object
      required: [id, kind, category, severity, title, culprit, first_seen_unix, last_seen_unix, occurrences, status, regressions, active, finding_id]
      properties:
        id: { type: string, description: "16 hex digits of the fingerprint; stable across restarts" }
        kind: { $ref: "#/components/schemas/FindingKind" }
        category: { type: string, enum: [hygiene, limit, performance] }
        severity: { type: string, enum: [info, low, medium, high], description: The highest any of its findings had }
        title: { type: string, description: The latest finding's title }
        culprit: { type: string, description: "What it is about, without pids: the normalized command, the agent and cap, or the memory consumer" }
        workspace: { type: string }
        first_seen_unix: { type: integer }
        last_seen_unix: { type: integer }
        occurrences: { type: integer, description: "Separate findings it was; one that lasts counts once" }
        status: { type: string, enum: [open, resolved, regressed, ignored] }
        status_unix: { type: integer, description: When the status last changed }
        regressions: { type: integer, description: Times it came back after being resolved }
        active: { type: boolean, description: A finding for it is current now }
        finding_id: { type: string, description: The latest finding's id }
    Finding:
      type: object
      required: [id, kind, severity, title, why, evidence, suggested, first_seen_unix, last_seen_unix, dismissed]
      properties:
        id: { type: string, description: "Stable while the cause lasts: <kind>:<pid>:<start_time>, or <kind>:<path or name>" }
        kind: { $ref: "#/components/schemas/FindingKind" }
        category: { type: string, enum: [security, hygiene, posture, limit, update, performance] }
        severity: { type: string, enum: [info, low, medium, high] }
        title: { type: string, description: "One sentence, an observation" }
        why: { type: string }
        evidence:
          type: object
          description: Only the fields that apply are present. `cmd` is redacted.
          properties:
            pid: { type: integer }
            start_time: { type: integer }
            name: { type: string }
            exe: { type: string }
            cmd: { type: string }
            cwd: { type: string }
            workspace: { type: string }
            age_secs: { type: integer }
            parent: { type: object, properties: { pid: { type: integer }, name: { type: string } } }
            listen: { type: array, items: { type: string } }
            signature: { type: string, enum: [apple, app_store, developer_id, development, other_signed, ad_hoc, unsigned, unknown] }
            quarantined: { type: boolean }
            cpu_pct: { type: number }
            mem_bytes: { type: integer }
            culprits:
              type: array
              description: |
                Memory findings only: what is using the most memory now, or holding the most swap when
                swap crossed its threshold. Processes in an agent session are counted under the session,
                the rest under their app, workspace or program. At most 8, biggest first.
              items:
                type: object
                required: [kind, key, name, cpu_pct, mem_bytes, swap_bytes]
                properties:
                  kind: { type: string, enum: [session, app, workspace, process, system] }
                  key: { type: string, description: "A session id, or a consumer group key (`app:…`, `workspace:…`, `process:…`, `system`)" }
                  name: { type: string }
                  cpu_pct: { type: number }
                  mem_bytes: { type: integer }
                  swap_bytes: { type: integer }
            path: { type: string }
            mode: { type: string }
            detail: { type: string }
            updates:
              type: array
              description: Update findings only. One item per package.
              items:
                type: object
                required: [package, source]
                properties:
                  package: { type: string }
                  installed: { type: string }
                  latest: { type: string, description: "The latest release; for an advisory, the first fixed version (absent when none is listed)" }
                  source: { type: string, description: "github, npm, homebrew, osv.dev, …" }
                  command: { type: string, description: What the user may run to update it; Mulchie runs nothing }
            perf:
              type: object
              description: "`build_slower` only: the baseline, the slow runs and what changed in between."
              properties:
                command: { type: string, description: The command as runs are grouped }
                baseline_ms: { type: integer, description: The median of the runs before the slow ones }
                baseline_runs: { type: integer }
                recent_ms: { type: array, items: { type: integer }, description: "The slow runs, oldest first" }
                ratio: { type: number, description: The median of the slow runs over the baseline }
                from_head: { type: string, description: HEAD at the last normal run }
                to_head: { type: string, description: HEAD at the first slow run }
                commits:
                  type: array
                  description: "The recorded moves of HEAD between them, oldest first (at most 20, the newest)"
                  items: { $ref: "#/components/schemas/CommitEntry" }
                commits_truncated: { type: boolean }
            endpoint:
              type: object
              description: "`endpoint_slower` and `endpoint_errors` only: the recent and usual figures and what changed in between."
              properties:
                service: { type: string }
                operation: { type: string }
                recent_minutes: { type: integer }
                recent_count: { type: integer }
                recent_errors: { type: integer }
                recent_p95_ms: { type: number }
                recent_error_rate: { type: number }
                baseline_p95_ms: { type: number }
                baseline_error_rate: { type: number }
                baseline_windows: { type: integer }
                ratio: { type: number, description: The recent p95 over the baseline p95 }
                service_version: { type: string }
                environment: { type: string }
                attribution: { $ref: "#/components/schemas/EndpointAttribution" }
                from_revision: { type: string, description: The commit at the end of the baseline }
                to_revision: { type: string, description: The commit running now }
                commits:
                  type: array
                  description: "The recorded moves of HEAD between them, oldest first (at most 20, the newest)"
                  items: { $ref: "#/components/schemas/CommitEntry" }
                commits_truncated: { type: boolean }
            devserver:
              type: object
              description: "`dev_server_slow_start` and `dev_server_heavier` only: the baseline, the recent runs and what changed in between."
              properties:
                command: { type: string }
                measure: { type: string, enum: [time_to_listen, settled_memory] }
                baseline: { type: integer, description: "Milliseconds for time_to_listen, bytes for settled_memory; the median of the runs before the slow ones" }
                baseline_runs: { type: integer }
                recent: { type: array, items: { type: integer }, description: "The latest runs, oldest first, in the same unit" }
                ratio: { type: number }
                uncertainty_ms: { type: integer, description: "time_to_listen only: the largest uncertainty of the runs compared" }
                from_head: { type: string }
                to_head: { type: string }
                commits:
                  type: array
                  description: "The recorded moves of HEAD between them, oldest first (at most 20, the newest)"
                  items: { $ref: "#/components/schemas/CommitEntry" }
                commits_truncated: { type: boolean }
            deploy:
              type: object
              description: "`production_slower` only: the provider, the deploy, the metric before and after, and the commits in the deploy."
              properties:
                provider: { type: string, enum: [vercel, sentry, posthog] }
                metric: { type: string }
                metric_label: { type: string }
                deploy_id: { type: string }
                sha: { type: string }
                deploy_unix: { type: integer }
                previous_deploy_id: { type: string }
                previous_sha: { type: string }
                before_ms: { type: number, description: "The median over the deploys before" }
                baseline_deploys: { type: integer }
                after_ms: { type: number }
                ratio: { type: number }
                workspace: { type: string }
                commits:
                  type: array
                  items: { $ref: "#/components/schemas/DeployCommit" }
                commits_truncated: { type: boolean }
        suggested:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              request: { $ref: "#/components/schemas/Request" }
              api: { type: string, description: "Another route to call, in words, e.g. the dismiss route" }
              api_request:
                type: object
                description: The same call as `api`, as data
                required: [method, route]
                properties:
                  method: { type: string, enum: [GET, POST] }
                  route: { type: string, description: "With path parameters filled in, e.g. /v1/sessions/s-1730000000-4242" }
                  body: { type: object, description: The JSON body of a POST }
              reversible: { type: boolean }
        first_seen_unix: { type: integer }
        last_seen_unix: { type: integer }
        dismissed: { type: boolean }
        dismissed_until: { type: integer }
    Session:
      type: object
      properties:
        id: { type: string }
        agent: { type: string }
        source: { type: string, enum: [detected, hook] }
        status: { type: string, enum: [running, ended] }
        root_pid: { type: integer }
        root_start_time: { type: integer }
        parent: { type: [string, "null"], description: The session that started this one }
        client: { type: [string, "null"] }
        client_session_id: { type: [string, "null"] }
        command: { type: string, description: Redacted }
        cwd: { type: [string, "null"] }
        workspace: { type: [string, "null"] }
        started_unix: { type: integer }
        ended_unix: { type: [integer, "null"] }
        last_active_unix:
          type: integer
          description: >-
            When the session last did something this engine saw: it used 5% of a core or more,
            started a process, or its agent called a hook. A heuristic, never earlier than when
            this engine first saw the session, and frozen once the session ends. Also on each
            entry of `state.sessions.list`.
        listening: { type: array, items: { type: integer }, description: "Ports the session's processes listen on, from the last watch run" }
        enforced:
          type: boolean
          description: >-
            Whether a breach of this session's limits would be acted on by this engine (also on
            each entry of `state.sessions.list`).
        not_enforced_reason:
          type: string
          enum: [hook_registered, not_automating, no_budget, notify_only, ended]
          description: >-
            Present when `enforced` is false. `hook_registered`: a hook call named the session, so
            Mulchie only reports. `not_automating`: this engine does not hold the lock or its
            config did not load. `no_budget`: no budget applies to its workspace. `notify_only`:
            every cap of its budget only notifies. `ended`: the session ended.
        usage: { $ref: "#/components/schemas/SessionUsage" }
        peak: { type: object, properties: { cpu_cores: { type: number }, memory_mb: { type: number }, processes: { type: integer }, write_mb_per_hour: { type: [number, "null"] } } }
    SessionUsage:
      type: object
      properties:
        cpu_cores: { type: number }
        memory_mb: { type: number }
        processes: { type: integer }
        build_slots: { type: integer }
        bytes_written: { type: [integer, "null"], description: Null where per-process writes cannot be read }
        write_mb_per_hour: { type: [number, "null"] }
        runtime_secs: { type: integer }
    MemoryGuardStatus:
      type: object
      description: >-
        The memory guard (`memory_guard` in config), also `memory_guard` in `GET /v1/state`.
        When memory stays low, or a unit stays over `memory_guard.unit_max_mb`, the biggest
        closable unit is reported (`action: notify`) or closed (`action: stop`: SIGTERM, then
        SIGKILL after `stop_grace_secs`, through the safety gate). A unit is what one agent
        session started, or with `scope: all` any other unprotected app, workspace or program
        of the user that does not host an agent session.
      properties:
        action: { type: string, enum: [off, notify, stop] }
        scope: { type: string, enum: [sessions, all] }
        enforcing: { type: boolean, description: "The action is `stop` and this engine automates" }
        low: { type: boolean, description: "Memory has been low for `sustain_secs`" }
        low_since_unix: { type: integer, nullable: true }
        free_pct: { type: number, description: Percent of memory available at the last sample }
        swap_pct: { type: number, description: "Swap in use at the last sample, as a percent of physical memory; at `memory_guard.swap_pct` or more memory counts as low" }
        pressure: { type: string, nullable: true, enum: [normal, warning, critical] }
        would_close:
          nullable: true
          type: object
          description: The unit that qualifies now
          properties:
            key: { type: string, description: "`session:<id>` or a consumer group key" }
            name: { type: string }
            kind: { type: string, enum: [session, workspace, app, process] }
            mem_mb: { type: number }
            processes: { type: integer }
            trigger: { type: string, enum: [memory_low, over_cap, swap_high] }
        closings:
          type: array
          description: What the guard closed or tried to, newest first, at most 50, since this engine started
          items:
            type: object
            properties:
              id: { type: string }
              at_unix: { type: integer }
              trigger: { type: string, enum: [memory_low, over_cap, swap_high] }
              free_pct: { type: number }
              swap_pct: { type: number }
              pressure: { type: string, nullable: true }
              key: { type: string }
              name: { type: string }
              kind: { type: string, enum: [session, workspace, app, process] }
              session_id: { type: string, nullable: true }
              workspace: { type: string, nullable: true }
              mem_mb: { type: number }
              processes: { type: integer }
              state: { type: string, enum: [pending, done, partial, skipped, not_enforced] }
              detail: { type: string, nullable: true }
    RunawayStatus:
      type: object
      description: >-
        Runaway chains (`runaway` in config), also `runaway` in `GET /v1/state`. A chain is one
        command line, in one working directory, running nested inside at least `depth` copies of
        itself (a build script that calls itself). It is reported (`action: notify`) or stopped
        (`action: stop`: SIGSTOP to the outermost copy and everything under it, from a fresh
        process list, until nothing new appears, then SIGKILL, through the safety gate).
      properties:
        action: { type: string, enum: [off, notify, stop] }
        depth: { type: integer, description: "`runaway.depth`" }
        enforcing: { type: boolean, description: "The action is `stop` and this engine automates" }
        chains:
          type: array
          description: The chains running at the last sample
          items:
            type: object
            properties:
              key: { type: string, description: "`chain:<pid>:<start time>` of the outermost copy" }
              command: { type: string, description: "The command line that repeats, redacted and shortened" }
              cwd: { type: string, nullable: true }
              depth: { type: integer, description: Copies nested inside each other }
              root_pid: { type: integer, description: The outermost copy }
              processes: { type: integer, description: The outermost copy and everything it started }
              mem_mb: { type: number }
              session_id: { type: string, nullable: true }
              workspace: { type: string, nullable: true }
              first_seen_unix: { type: integer }
        stoppings:
          type: array
          description: What Mulchie stopped or tried to, newest first, at most 50, since this engine started
          items:
            type: object
            properties:
              id: { type: string }
              at_unix: { type: integer }
              key: { type: string }
              command: { type: string }
              cwd: { type: string, nullable: true }
              depth: { type: integer }
              processes: { type: integer }
              mem_mb: { type: number }
              session_id: { type: string, nullable: true }
              workspace: { type: string, nullable: true }
              state: { type: string, enum: [pending, done, partial, skipped, not_enforced] }
              detail: { type: string, nullable: true }
        remembered:
          type: array
          description: Commands the `runaway_repeat` guard rule matches now
          items:
            type: object
            properties:
              command: { type: string, description: "The program and its arguments, as the rule matches them" }
              cwd: { type: string }
              depth: { type: integer, description: The deepest nesting seen }
              at_unix: { type: integer }
              until_unix: { type: integer }
    Breach:
      type: object
      description: A session over one cap of its budget.
      properties:
        id: { type: string }
        session_id: { type: string }
        agent: { type: string }
        cap: { type: string, enum: [cpu_cores, memory_mb, processes, write_mb_per_hour, runtime_hours] }
        max: { type: number }
        value: { type: number }
        peak: { type: number }
        action: { type: string, enum: [notify, deprioritize, pause, stop] }
        sustain_secs: { type: integer }
        resume_after_secs: { type: integer }
        over_since_unix: { type: integer }
        breached_unix: { type: integer }
        action_state: { type: string, enum: [pending, done, partial, skipped, notify_only, not_enforced] }
        action_detail: { type: string }
        cleared_unix: { type: [integer, "null"] }
        restored: { type: boolean, description: A deprioritize or pause was undone }
        delivered: { type: boolean, description: Handed to the agent in a hook reply }
    PausedProc:
      type: object
      properties:
        pid: { type: integer }
        start_time: { type: integer }
        session_id: { type: string }
        breach_id: { type: string }
        since_unix: { type: integer }
        pausing: { type: boolean, description: "Recorded before SIGSTOP was sent and not yet confirmed; absent once it was" }
